[project]
name = "openballot-worker"
version = "0.1.0"
description = "OpenBallot Nigeria - ingestion, extraction, verification and audit worker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic[email]>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "asyncpg>=0.29",
  "redis>=5.0",
  "rq>=1.16",
  "pillow>=10.2",
  "piexif>=1.1.3",
  "python-multipart>=0.0.9",
  "structlog>=24.1",
  "tenacity>=8.2",
  "geopy>=2.4",
  "web3>=6.15",
  "PyJWT>=2.8",
  "phonenumbers>=8.13",
  "google-cloud-documentai>=2.24",
  "openai>=1.30",
  "eth-account>=0.11",
  "sentry-sdk[fastapi]>=2.0",
  "prometheus-client>=0.20",
  "boto3>=1.34"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.3",
  "mypy>=1.9",
  "httpx>=0.27"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Two top-level packages: `app` for the FastAPI service modules and
# `cli` for the worker entry points (cli.run_worker, cli.recovery,
# cli.migrate). setuptools' auto-discovery refuses to pick when more
# than one top-level package exists, so we declare them explicitly.
[tool.setuptools.packages.find]
include = ["app*", "cli*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

# The rule set is pinned explicitly.
#
# Without a `select`, ruff enforces whatever its current release considers
# default, and that set grows. `ruff>=0.3` in the dev extra resolves to the
# newest release, so CI's definition of "clean" changed underneath the
# repository and the Lint step began failing on 122 findings in code nobody
# had touched. A linter that reports different results on the same commit
# depending on the day is not a check; pin it, and change it deliberately.
[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # import sorting
  "UP",        # pyupgrade
  "B",         # bugbear
  "C4",        # comprehensions
  "SIM",       # simplify
  "PIE",       # misc lints
  "RUF",       # ruff-specific
  "S",         # bandit (security)
]
ignore = [
  # FastAPI's dependency injection IS a call in an argument default --
  # `Depends(...)`, `File(...)`, `Query(...)`. Applying this rule's advice
  # would break dependency injection across every router in the service.
  "B008",
  # Long, explanatory comment lines are worth more here than a column limit.
  # E501 still applies to code via line-length.
  "E501",
  # `class Foo(str, Enum)` -> `StrEnum` is NOT a cosmetic change. It alters
  # what str() and f-strings produce: "AnomalyType.VOTES_EXCEED_REGISTERED"
  # becomes "votes_exceed_registered". These enums reach log lines, JSONB
  # columns and the audit chain, so the rewrite would quietly change recorded
  # values. Worth doing deliberately, with the call sites audited -- not as a
  # side effect of a lint pass.
  "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on behaviour, not on hardened credentials handling.
"tests/*" = [
  "S101",    # assert is the point of a test
  "S105",    # "hardcoded password" - test fixtures
  "S106",
  "S311",    # pseudo-random in fixtures is fine
]
# Operator scripts are run by hand, not served.
"cli/*" = ["S101"]
# These tests import a script from repo `scripts/`, which needs sys.path
# adjusting first -- so the import genuinely cannot sit at the top of the file.
"tests/test_2023_baseline_loader.py" = ["E402"]
"tests/test_2023_lga_results_loader.py" = ["E402"]
"tests/test_eval_authentication.py" = ["E402"]
"tests/test_pu_enrichment.py" = ["E402"]
"tests/test_ward_reconciliation.py" = ["E402"]
